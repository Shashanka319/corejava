<!DOCTYPE html>
<html>

<head>
    <title>Course Registration Form</title>
</head>

<body>

    <form>

        <div>
            <h1>Course Registration</h1>
        </div>

        <div>
            <b>Student Name</b>
            <span>*</span>
            <span>:</span>
            <input type="text" id="studentName" name="studentName" required>
        </div>

        <div>
            <b>Email</b>
            <span>*</span>
            <span>:</span>
            <input type="email" id="email" name="email">
        </div>

        <div>
            <b>Password</b>
            <span>*</span>
            <span>:</span>
            <input type="password" id="password" name="password">
        </div>

        <div>
            <b>Age</b>
            <span>*</span>
            <span>:</span>
            <input type="number" id="age" name="age">
        </div>

        <div>
            <b>Contact Number</b>
            <span>*</span>
            <span>:</span>
            <input type="tel" id="phone" name="phone">
        </div>

        <div>
            <b>Course Starting Date</b>
            <span>*</span>
            <span>:</span>
            <input type="date" id="date" name="date">
        </div>

        <div>
            <b>Course Daily Time</b>
            <span>*</span>
            <span>:</span>
            <input type="time" id="time" name="time">
        </div>

        <div>
            <b>Gender</b>
            <span>*</span>
            <span>:</span>
            <input type="text" id="gender" name="gender">
        </div>

       
        <div>
            <b>Skill Level</b>
            <span>*</span>
            <span>:</span>
            <input type="range" id="skill" name="skill" min="1" max="10">
        </div>

       
            <b>Select Mode</b>
            <span>*</span>
            <span>:</span>
            <input type="radio" id="java Full Stack" name="Select">Java Full Stack
            <input type="radio" id="python Full Stack" name="Select">python Full Stack
        </div>

        <div>
            <b>Select Platform</b>
            <span>*</span>
            <span>:</span>
            <input type="checkbox" id="frontend" name="platform">frontend
             <input type="checkbox" id="backend" name="platform">backend
             <input type="checkbox" id="mobile" name="platform">mobile
             <input type="checkbox" id="web" name="platform">web
            <input type="checkbox" id="console" name="platform">Console
        </div>

        <div>
            <input type="reset" id="reset" name="reset" value="Clear Form">
        </div>

        <div>
            <input type="submit" id="submit" name="submit" value="Register">
        </div>

    </form>

</body>

</html>
